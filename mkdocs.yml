site_name: Pakon F-X35 Reference
site_description: >-
  An implementation-agnostic reference for how the Kodak/Pakon F-X35 film
  scanners work — protocol, image stream, calibration, and colour.
copyright: >-
  CC BY 4.0, <a href="https://alibosworth.com">Ali Bosworth</a> &middot;
  <a href="https://github.com/alibosworth/pakon-reference">View project on GitHub</a> &middot;
  Corrections welcome: <a href="https://github.com/alibosworth/pakon-reference/issues">open an issue</a>

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
  - attr_list

nav:
  - Home: index.md
  - Conventions: CONVENTIONS.md
  - Per-unit data & safety: per-unit-data-and-safety.md
  - USB identity & firmware: usb-identity-and-firmware.md
  - PPB protocol: ppb-protocol.md
  - Command reference: command-reference.md
  - Image stream: image-stream.md
  - Calibration: calibration.md
  - Colour pipeline: color-pipeline.md
  - Film transport: film-transport.md
  - DX barcode: dx-barcode.md
  - Scanner family: scanner-family.md
  - Resources:
      - DX product-code table: resources/dx-product-code-table.md
  - Changelog: CHANGELOG.md

plugins:
  - search

extra:
  generator: false
